<svg xmlns="http://www.w3.org/2000/svg" viewBox='0 0 200 100'   width = "200" >
  <!-- background -->
  <rect width="100%" height="100%" fill='#fafafa'/>

  <style><![CDATA[
    .label { font: 12px sans-serif; }
  ]]></style>

  <g id="shapes" transform = "translate(10, 10)"  >
    <!-- two squares, one per line -->
    <rect x="0" y="0" width="20" height="20" fill="tomato" /> <rect x="30" y="0"
          width="20" height="20"
          fill="gold"/>
    <circle cx="80" cy="10" r="10" fill="teal"></circle>
    <g id="empty"></g>
    <g id="selfclosed" />
  </g>

  <text class="label" x="10" y="80">Bread &amp; butter &#x2014; <tspan font-weight="bold">bold</tspan> tail</text>
  <line x1="0" y1="95" x2="200" y2="95" stroke="#333" stroke-dasharray="4 2"/>
</svg>
