name: CI

# CI is the build of record: install, typecheck, test and build all run here.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same-repo PRs are already covered by the push run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Headless SDK example
        run: |
          pnpm --filter @svg-editor/sdk example "$RUNNER_TEMP/chart.svg"
          grep -q "Downloads per month" "$RUNNER_TEMP/chart.svg"

      - name: End-to-end (Electron app)
        run: xvfb-run -a pnpm --filter @svg-editor/desktop test:e2e

      - name: Upload build output
        if: matrix.node == 22
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            packages/*/dist
            apps/desktop/out
          if-no-files-found: error
          retention-days: 14

      - name: Upload e2e results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results-node${{ matrix.node }}
          path: apps/desktop/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Installers are built here, never locally: one job per OS, smoke-tested,
  # uploaded as workflow artifacts (Actions run page -> Artifacts).
  package:
    name: Package (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm --filter @svg-editor/desktop build

      - name: Package installer
        run: pnpm --filter @svg-editor/desktop package
        env:
          # Unsigned builds until signing certificates are configured.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Smoke test the packaged app
        shell: bash
        working-directory: apps/desktop
        run: |
          case "$RUNNER_OS" in
            Linux)   APP="$PWD/release/linux-unpacked/svg-editor"; RUN="xvfb-run -a" ;;
            Windows) APP="$(cygpath -w "$PWD/release/win-unpacked/svg-editor.exe")"; RUN="" ;;
            macOS)   APP="$(ls -d "$PWD"/release/mac-arm64/*.app)/Contents/MacOS/$(ls "$(ls -d "$PWD"/release/mac-arm64/*.app)/Contents/MacOS" | head -1)"; RUN="" ;;
          esac
          echo "Testing $APP"
          PACKAGED_APP="$APP" $RUN pnpm exec playwright test e2e/packaged.spec.ts

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SVG-Editor-${{ runner.os }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 30
