<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No remote content, no inline scripts. SVG from the user cannot run script. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>SVG Editor</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="pane code-pane" aria-label="SVG code"><div id="code"></div></section>
      <section class="pane canvas-pane" aria-label="Canvas">
        <div id="canvas"></div>
        <div id="status" role="status"></div>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
