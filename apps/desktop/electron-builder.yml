# Installers are built in GitHub Actions (.github/workflows/ci.yml, "package" job).
appId: dev.svg-editor.desktop
productName: SVG Editor
executableName: svg-editor
copyright: Copyright © aman-dhakar-191
directories:
  output: release
# Everything the app needs is bundled into out/ by electron-vite; no node_modules.
files:
  - out/**/*
  - package.json
npmRebuild: false
asar: true
# No spaces: this is also the release asset and artifact name.
artifactName: "SVG-Editor-${version}-${os}-${arch}.${ext}"
linux:
  target: [AppImage]
  category: Graphics
  executableName: svg-editor
  syncDesktopName: true
win:
  target: [nsis]
nsis:
  # Wizard: welcome, location, options, ready, install, finish (build/installer.nsh).
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Installs to C:\Program Files\SVG Editor (asks for admin rights).
  perMachine: true
  include: build/installer.nsh
  shortcutName: SVG Editor
mac:
  # Apple silicon and Intel.
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.graphics-design
  # Unsigned until a signing certificate is configured.
  identity: null
publish: null
