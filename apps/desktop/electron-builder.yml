# Installers are built in GitHub Actions (.github/workflows/ci.yml, "package" job).
appId: dev.svg-editor.desktop
productName: SVG Editor
# No top-level executableName: on Windows it would also name the install folder
# (C:\Program Files\svg-editor). Windows and macOS use the product name; Linux sets its own.
copyright: Copyright © aman-dhakar-191
directories:
  output: release
# Everything the app needs is bundled into out/ by electron-vite; no node_modules.
files:
  - out/**/*
  - package.json
npmRebuild: false
asar: true
# No spaces: this is also the release asset and artifact name.
artifactName: "SVG-Editor-${version}-${os}-${arch}.${ext}"
linux:
  target: [AppImage]
  category: Graphics
  executableName: svg-editor
  syncDesktopName: true
win:
  target: [nsis]
nsis:
  # Wizard: welcome, location, options, ready, install, finish (build/installer.nsh).
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Current user only (build/installer.nsh forces it): installs to
  # %LOCALAPPDATA%\Programs\SVG Editor and never asks for admin rights.
  perMachine: false
  include: build/installer.nsh
  shortcutName: SVG Editor
mac:
  # Apple silicon and Intel.
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.graphics-design
  # Unsigned until a signing certificate is configured. macOS only installs signed
  # updates, so macOS builds get no update feed.
  identity: null
  publish: null
# The app updates itself from GitHub Releases (Windows and Linux). CI builds with
# --publish never and attaches the installers plus latest*.yml and .blockmap files itself;
# this entry makes the build write those files and the app's app-update.yml.
publish:
  provider: github
  owner: aman-dhakar-191
  repo: svg-builder-sdk
  releaseType: release
